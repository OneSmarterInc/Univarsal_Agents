# Universal Agents on one server: database, model, API and two workers.
#   cp deploy/env.example deploy/.env        (then fill it in)
#   docker compose -f deploy/compose.yml --env-file deploy/.env up -d --build
# With an NVIDIA GPU, add:  -f deploy/compose.gpu.yml
# With HTTPS on this server (Caddy), add:  --profile https

name: universal-agents

x-agents: &agents
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  image: universal-agents:${AGENTS_IMAGE_TAG:-local}
  restart: unless-stopped
  env_file: .env
  environment:
    AGENTS_DATABASE_URL: postgresql+psycopg://agents:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}@postgres:5432/agents
    AGENTS_DATA_DIR: /app/data
    AGENTS_MODEL_BASE_URL: http://ollama:11434/v1
    # The model is on the private Docker network only, so plain HTTP is allowed here.
    AGENTS_MODEL_ALLOW_HTTP: "true"
  volumes:
    - files:/app/data
  logging: &logging
    driver: json-file
    options: {max-size: "20m", max-file: "5"}

services:
  postgres:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: agents
      POSTGRES_USER: agents
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agents -d agents"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

  ollama:
    image: ollama/ollama:${OLLAMA_VERSION:-0.6.8}
    restart: unless-stopped
    environment:
      # One CV at a time per worker; keep the model loaded between questions.
      OLLAMA_KEEP_ALIVE: 24h
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 10
    logging: *logging

  # Downloads the model once and names it kormic-local (the name the agents ask for).
  model-init:
    image: ollama/ollama:${OLLAMA_VERSION:-0.6.8}
    environment:
      OLLAMA_HOST: http://ollama:11434
    volumes:
      - ./Modelfile:/Modelfile.base:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        set -e;
        ollama pull qwen3:${MODEL_TAG:-1.7b};
        { echo "FROM qwen3:${MODEL_TAG:-1.7b}"; cat /Modelfile.base; } > /tmp/Modelfile;
        ollama create kormic-local -f /tmp/Modelfile;
        echo "kormic-local ready (qwen3:${MODEL_TAG:-1.7b})"
    depends_on:
      ollama: {condition: service_healthy}
    restart: "no"
    logging: *logging

  # Creates or upgrades the database tables, then stops.
  migrate:
    <<: *agents
    command: ["init-db"]
    restart: "no"
    healthcheck: {disable: true}
    depends_on:
      postgres: {condition: service_healthy}

  api:
    <<: *agents
    command: ["serve", "--host", "0.0.0.0", "--port", "8000", "--workers", "2"]
    # Only this server can reach the API directly; HTTPS comes from Caddy or a load balancer.
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate: {condition: service_completed_successfully}

  # CV and LinkedIn: these ask the model, one file at a time.
  worker-docs:
    <<: *agents
    command: ["worker", "--agents", "cv,linkedin"]
    healthcheck: {disable: true}
    stop_grace_period: 15m
    depends_on:
      migrate: {condition: service_completed_successfully}
      model-init: {condition: service_completed_successfully}

  # NPPES, OIG, SAM and GitHub: outside lookups that take seconds.
  worker-lookups:
    <<: *agents
    command: ["worker", "--agents", "nppes,oig,sam,github"]
    healthcheck: {disable: true}
    stop_grace_period: 2m
    depends_on:
      migrate: {condition: service_completed_successfully}

  # HTTPS with a free certificate for API_DOMAIN (ports 80 and 443 must be open).
  caddy:
    image: caddy:${CADDY_VERSION:-2.8.4}
    profiles: ["https"]
    restart: unless-stopped
    command: ["caddy", "reverse-proxy", "--from", "${API_DOMAIN:-localhost}", "--to", "api:8000"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy:/data
    depends_on:
      api: {condition: service_healthy}
    logging: *logging

volumes:
  pgdata:
  ollama:
  files:
  caddy:

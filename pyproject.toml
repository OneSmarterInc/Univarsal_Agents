[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-agents"
version = "1.2.0"
description = "Shared extraction agents (CV, LinkedIn, ...) for OneSmarter projects"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "python-multipart>=0.0.20",
  "sqlalchemy>=2.0,<2.1",
  "alembic>=1.14,<2",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.10,<3",
  "httpx>=0.28,<1",
  "pypdf>=6",
  "pypdfium2>=4.30",
  "python-docx>=1.1",
  "Pillow>=11",
  "pytesseract>=0.3.13",
  "defusedxml>=0.7.1",
  "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
s3 = ["boto3>=1.35"]
anthropic = ["anthropic>=0.40"]
test = ["pytest>=8", "ruff>=0.11", "reportlab>=4", "moto[s3]>=5", "boto3>=1.35"]

[project.scripts]
agents = "agents_service.cli.main:main"

[tool.setuptools.packages.find]
include = ["agents_service*"]

[tool.setuptools.package-data]
agents_service = ["migrations/*.py", "migrations/*.mako", "migrations/versions/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:moto.*"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["legacy"]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "BLE", "C90", "TID"]
ignore = ["S101", "E501", "S603", "S404", "B008"]

[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108"]
"agents_service/migrations/**" = ["I001"]

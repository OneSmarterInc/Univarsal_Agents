server {
    listen 8080;
    access_log off;
    error_log /dev/stderr crit;
    client_max_body_size 256k;
    location ~ ^/api/(chat|tags|show|version)$ {
        proxy_pass http://ollama:11434;
        proxy_read_timeout 190s;
        proxy_connect_timeout 5s;
    }
    location / { return 404; }
}
